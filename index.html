<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Portal - Ilupeju Patriotic Club</title>
    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="max-w-4xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        <!-- Header -->
        <div class="bg-white rounded-t-2xl shadow-sm p-8 border-b border-gray-100 text-center">
            <h1 class="text-3xl font-bold text-emerald-800">Ilupeju Patriotic Club</h1>
            <p class="text-gray-500 mt-1">Official Membership Application Portal</p>
        </div>

        <!-- Form Container -->
        <form id="registrationForm" class="bg-white rounded-b-2xl shadow-xl p-8 space-y-8">
            
            <!-- Section 1: Personal Information -->
            <div>
                <h2 class="text-xl font-semibold text-gray-700 border-b pb-2 mb-4">1. Personal Information</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
                        <input type="text" id="fullName" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth *</label>
                        <input type="date" id="dob" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Marital Status *</label>
                        <select id="maritalStatus" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="">Select Status</option>
                            <option value="Single">Single</option>
                            <option value="Married">Married</option>
                            <option value="Divorced">Divorced</option>
                            <option value="Widowed">Widowed</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number *</label>
                        <input type="tel" id="phone" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address *</label>
                        <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">City / State *</label>
                        <input type="text" id="cityState" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Contact Address *</label>
                        <textarea id="contactAddress" rows="2" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Permanent Address</label>
                        <textarea id="permanentAddress" rows="2" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                    </div>
                </div>
            </div>

            <!-- Section 2: Professional Details -->
            <div>
                <h2 class="text-xl font-semibold text-gray-700 border-b pb-2 mb-4">2. Professional & Business Details</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Occupation *</label>
                        <input type="text" id="occupation" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Employer / Company Name</label>
                        <input type="text" id="employer" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nature of Business</label>
                        <input type="text" id="natureOfBusiness" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- Section 3: Family & Emergency -->
            <div>
                <h2 class="text-xl font-semibold text-gray-700 border-b pb-2 mb-4">3. Family & Emergency Contacts</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Spouse Name (If applicable)</label>
                        <input type="text" id="spouseName" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Spouse Phone Number</label>
                        <input type="tel" id="spousePhone" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>

                <!-- Children Grid -->
                <div class="space-y-3 mb-6 bg-gray-50 p-4 rounded-xl">
                    <label class="block text-sm font-medium text-gray-700">Children Information (Up to 4)</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input type="text" id="child1Name" placeholder="Child 1 Name" class="px-3 py-2 border rounded-md bg-white">
                        <input type="text" id="child1Age" placeholder="Child 1 Age" class="px-3 py-2 border rounded-md bg-white">
                        <input type="text" id="child2Name" placeholder="Child 2 Name" class="px-3 py-2 border rounded-md bg-white">
                        <input type="text" id="child2Age" placeholder="Child 2 Age" class="px-3 py-2 border rounded-md bg-white">
                        <input type="text" id="child3Name" placeholder="Child 3 Name" class="px-3 py-2 border rounded-md bg-white">
                        <input type="text" id="child3Age" placeholder="Child 3 Age" class="px-3 py-2 border rounded-md bg-white">
                        <input type="text" id="child4Name" placeholder="Child 4 Name" class="px-3 py-2 border rounded-md bg-white">
                        <input type="text" id="child4Age" placeholder="Child 4 Age" class="px-3 py-2 border rounded-md bg-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Emergency Contact Name *</label>
                        <input type="text" id="emergencyName" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Relationship *</label>
                        <input type="text" id="emergencyRelation" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Emergency Phone *</label>
                        <input type="tel" id="emergencyPhone" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- Section 4: Club Sponsorship & Passport Upload -->
            <div>
                <h2 class="text-xl font-semibold text-gray-700 border-b pb-2 mb-4">4. Sponsorship & Documentation</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Expected Contributions / Ideas</label>
                        <textarea id="expectedContributions" rows="2" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Sponsor Name & Comments</label>
                        <input type="text" id="sponsorName" placeholder="Sponsor Name" class="w-full px-4 py-2 border rounded-lg mb-2 focus:outline-none">
                        <input type="text" id="sponsorComments" placeholder="Sponsor Comments" class="w-full px-4 py-2 border rounded-lg focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Passport Photograph (JPEG/PNG/PDF) *</label>
                    <input type="file" id="passportFile" accept="image/*,application/pdf" required class="w-full px-3 py-2 border rounded-lg bg-gray-50 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
                </div>
            </div>

            <!-- Submit Button -->
            <div class="pt-4">
                <button type="submit" id="submitBtn" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-3 px-6 rounded-xl transition duration-200 shadow-md">
                    Submit Application
                </button>
            </div>

            <!-- Status Feedback Box -->
            <div id="statusMessage" class="hidden text-center p-4 rounded-xl font-medium"></div>
        </form>
    </div>

    <!-- Frontend Script -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyvsPTu3HB7VX9J2UwUm2eO4M02bm4eTLUJbBhBQH0PqYnXrRKsYNUekmspdB8hZnVu0Q/exec";

        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('statusMessage');
            
            btn.disabled = true;
            btn.innerText = "Submitting application...";
            statusDiv.className = "hidden";

            const fileInput = document.getElementById('passportFile');
            if (fileInput.files.length === 0) {
                alert("Please upload a passport photograph.");
                btn.disabled = false;
                btn.innerText = "Submit Application";
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function() {
                const base64Data = reader.result.split(',')[1];

                const payload = {
                    action: "register",
                    fullName: document.getElementById('fullName').value,
                    dob: document.getElementById('dob').value,
                    maritalStatus: document.getElementById('maritalStatus').value,
                    contactAddress: document.getElementById('contactAddress').value,
                    permanentAddress: document.getElementById('permanentAddress').value,
                    cityState: document.getElementById('cityState').value,
                    phone: document.getElementById('phone').value,
                    email: document.getElementById('email').value,
                    occupation: document.getElementById('occupation').value,
                    employer: document.getElementById('employer').value,
                    natureOfBusiness: document.getElementById('natureOfBusiness').value,
                    spouseName: document.getElementById('spouseName').value,
                    spousePhone: document.getElementById('spousePhone').value,
                    child1Name: document.getElementById('child1Name').value,
                    child1Age: document.getElementById('child1Age').value,
                    child2Name: document.getElementById('child2Name').value,
                    child2Age: document.getElementById('child2Age').value,
                    child3Name: document.getElementById('child3Name').value,
                    child3Age: document.getElementById('child3Age').value,
                    child4Name: document.getElementById('child4Name').value,
                    child4Age: document.getElementById('child4Age').value,
                    emergencyName: document.getElementById('emergencyName').value,
                    emergencyRelation: document.getElementById('emergencyRelation').value,
                    emergencyPhone: document.getElementById('emergencyPhone').value,
                    expectedContributions: document.getElementById('expectedContributions').value,
                    sponsorName: document.getElementById('sponsorName').value,
                    sponsorComments: document.getElementById('sponsorComments').value,
                    passportData: base64Data,
                    passportMime: file.type,
                    passportName: file.name
                };

                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();

                    if (result.status === "success") {
                        statusDiv.className = "block bg-emerald-50 text-emerald-800 p-4 rounded-xl text-center";
                        statusDiv.innerText = "Application submitted successfully! Your submission is under review. Check your email for updates.";
                        document.getElementById('registrationForm').reset();
                    } else {
                        throw new Error(result.message || "Submission failed.");
                    }
                } catch (error) {
                    statusDiv.className = "block bg-red-50 text-red-800 p-4 rounded-xl text-center";
                    statusDiv.innerText = "Error: " + error.message;
                    btn.disabled = false;
                    btn.innerText = "Submit Application";
                }
            };

            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
